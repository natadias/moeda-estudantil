services:
  db:
    image: postgres:16-alpine
    container_name: moeda-estudantil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moeda
      POSTGRES_PASSWORD: moeda
      POSTGRES_DB: moeda_estudantil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
